{% extends "base.html" %}
{% load static %}

{% block title %}Dashboard | Server Monitor{% endblock %}

{% block content %}
<div
    id="dashboard"
    data-latest-url="{% url 'latest-record-fetch-api' %}"
    data-timeseries-url="{% url 'metrics-fetch-api' %}"
    data-alerts-url="{% url 'active-alerts-api' %}"
    data-thresholds-url="{% url 'threshold-list' %}"
    data-login-url="{% url 'login' %}"
    data-is-staff="{{ user.is_staff|yesno:'true,false' }}"
>
    <h1 class="h3 mb-4">System Overview</h1>

    <div id="metrics-error" class="alert alert-danger d-none" role="alert"></div>
    <div class="row" id="status-cards-container"></div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card shadow-sm mb-4">
                <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <span>Historical Metrics</span>
                    <div class="d-flex align-items-center gap-2">
                        <select id="metric-select" class="form-select form-select-sm w-auto" aria-label="Metric">
                            <option value="cpu">CPU</option>
                            <option value="memory">Memory</option>
                            <option value="disk">Disk</option>
                        </select>
                        <select id="range-select" class="form-select form-select-sm w-auto" aria-label="Time range">
                            <option value="6h">Last 6 hours</option>
                            <option value="24h">Last 24 hours</option>
                            <option value="48h" selected>Last 48 hours</option>
                            <option value="7d">Last 7 days</option>
                        </select>
                    </div>
                </div>
                <div class="card-body">
                    <div id="chart-error" class="alert alert-danger d-none" role="alert"></div>
                    <div id="chart-empty" class="text-muted d-none">No metric data for this range.</div>
                    <canvas id="metricChart" style="height: 500px;" role="img" aria-label="Metric history for all servers"></canvas>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-danger text-white">Alerts</div>
                <div id="alerts-error" class="alert alert-danger d-none m-3 mb-0" role="alert"></div>
                <ul class="list-group list-group-flush" id="alerts-list" aria-live="polite"></ul>
            </div>
        </div>
    </div>
</div>

<template id="server-card-template">
    <div class="col-md-6 col-xl-3 mb-4">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                    <h2 class="h5 card-title mb-0 server-name"></h2>
                    <span class="badge d-none status-badge"></span>
                </div>
                <p class="card-text mb-1 metric-cpu"></p>
                <p class="card-text mb-1 metric-memory"></p>
                <p class="card-text mb-1 metric-disk"></p>
                <p class="card-text small text-muted mb-2 last-seen"></p>
                <a class="btn btn-sm btn-outline-secondary threshold-link d-none"></a>
            </div>
        </div>
    </div>
</template>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" integrity="sha384-JUh163oCRItcbPme8pYnROHQMC6fNKTBWtRG3I3I0erJkzNgL7uxKlNwcrcFKeqF" crossorigin="anonymous"></script>
<script src="{% static 'monitor_app/dashboard.js' %}"></script>
{% endblock %}
